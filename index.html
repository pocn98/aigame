<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>2040 — 숫자를 합쳐라</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#101522;--panel:#1a2232;--board:#252f42;--empty:#344057;--ink:#f4f0e8;--muted:#9ba8bd;--accent:#c8f169;--line:#ffffff15}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#29354a 0,#151d2c 45%,#0d1320 100%);color:var(--ink);font-family:'Space Grotesk','Noto Sans KR',sans-serif;display:flex;justify-content:center;padding:32px 18px 48px}
.wrap{width:min(100%,510px)}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font-size:13px;font-weight:700;letter-spacing:.25em;color:var(--accent)}.edition{font:11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.12em}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}h1{font-size:clamp(64px,16vw,92px);line-height:.82;letter-spacing:-.09em;margin:0;font-weight:700}.tagline{color:var(--muted);font-size:13px;line-height:1.5;margin-top:15px}.scores{display:flex;gap:8px}.score{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:84px;text-align:center}.score span{display:block;color:var(--muted);font:10px 'DM Mono',monospace;letter-spacing:.1em}.score strong{display:block;font:500 21px 'DM Mono',monospace;margin-top:4px;color:var(--accent)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.buttons{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:11px 14px;font:700 12px 'Space Grotesk',sans-serif;cursor:pointer;transition:transform .12s,filter .12s}.btn:active{transform:scale(.96)}.btn.primary{background:var(--accent);color:#172018}.btn.secondary{background:#303c52;color:var(--ink);border:1px solid var(--line)}
.board-wrap{position:relative;background:var(--board);padding:10px;border-radius:16px;border:1px solid #ffffff12;box-shadow:0 24px 60px #0005;touch-action:pan-y}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;aspect-ratio:1}.cell{position:relative;border-radius:10px;background:var(--empty);display:grid;place-items:center;min-width:0;overflow:hidden}.tile{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;font:700 clamp(24px,7vw,38px) 'DM Mono',monospace;color:#27303a;animation:pop .13s ease-out;box-shadow:inset 0 -3px #0000000c}.tile[data-v="2"]{background:#e9e5d9}.tile[data-v="4"]{background:#d9e6c7}.tile[data-v="8"]{background:#b8d98a}.tile[data-v="16"]{background:#a6d16e}.tile[data-v="32"]{background:#f3c77b}.tile[data-v="64"]{background:#f2a85e}.tile[data-v="128"]{background:#ef9061;color:#fff;font-size:clamp(21px,6vw,32px)}.tile[data-v="256"]{background:#e97862;color:#fff;font-size:clamp(21px,6vw,32px)}.tile[data-v="512"]{background:#d85c66;color:#fff;font-size:clamp(20px,5.5vw,30px)}.tile[data-v="1024"],.tile[data-v="2048"]{background:#b69be8;color:#fff;font-size:clamp(18px,5vw,28px)}.tile.high{background:#7c8fd1;color:white;font-size:clamp(16px,4.5vw,25px)}@keyframes pop{from{transform:scale(.82);opacity:.5}to{transform:scale(1);opacity:1}}
.overlay{position:absolute;inset:10px;border-radius:11px;background:#101522dc;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(5px);z-index:2}.overlay.show{display:flex}.overlay h2{font-size:32px;margin:0 0 8px}.overlay p{color:var(--muted);font-size:13px;margin:0 0 18px}.below{display:flex;justify-content:space-between;gap:12px;margin-top:17px;color:var(--muted);font-size:11px;line-height:1.6}.below b{color:var(--ink);font-weight:600}.footer{border-top:1px solid var(--line);margin-top:26px;padding-top:15px;display:flex;justify-content:space-between;color:#6f7d94;font:10px 'DM Mono',monospace;letter-spacing:.08em}
@media(max-width:430px){body{padding:24px 13px 35px}.hero{display:block}.scores{margin-top:20px}.score{flex:1}.controls{align-items:flex-end}.hint{max-width:130px}.btn{padding:10px 11px}.board{gap:7px}.board-wrap{padding:8px}.overlay{inset:8px}}
</style>
</head>
<body>
<main class="wrap">
<header class="topline"><div class="brand">NUMBER LAB / 01</div><div class="edition">DAILY PUZZLE · 2040</div></header>
<section class="hero"><div><h1>2040<span style="color:var(--accent)">.</span></h1><p class="tagline">숫자를 합치고, 기록을 넘어라.<br>같은 숫자끼리 합쳐 2048을 만들어 보세요.</p></div><div class="scores"><div class="score"><span>SCORE</span><strong id="score">0</strong></div><div class="score"><span>BEST</span><strong id="best">0</strong></div></div></section>
<div class="controls"><div class="hint">방향키 또는 WASD로 이동<br>모바일은 보드를 밀어 보세요.</div><div class="buttons"><button class="btn secondary" id="undo">되돌리기</button><button class="btn primary" id="restart">새 게임 ↻</button></div></div>
<section class="board-wrap" aria-label="2040 숫자 퍼즐">
<div class="board" id="board"></div>
<div class="overlay" id="overlay"><h2 id="overTitle">게임 종료</h2><p id="overText">더 이상 움직일 수 없어요.</p><button class="btn primary" id="overlayBtn">다시 도전</button></div>
</section>
<div class="below"><span>HOW TO PLAY<br><b>같은 숫자 두 개를 합치면 두 배!</b></span><span style="text-align:right">GOAL<br><b>2 → 4 → 8 → ... → 2048</b></span></div>
<footer class="footer"><span>2040 / NUMBER MERGE</span><span>MADE TO THINK</span></footer>
</main>
<script>
const SIZE=4, $=id=>document.getElementById(id);
let grid,score,best=Number(localStorage.getItem('2040-best')||0),history=null,won=false,keepPlaying=false,over=false;
const clone=g=>g.map(r=>r.slice());
function empty(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0))}
function spawn(){const spots=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])spots.push([r,c]);if(!spots.length)return;const [r,c]=spots[Math.floor(Math.random()*spots.length)];grid[r][c]=Math.random()<.9?2:4}
function start(){grid=empty();score=0;history=null;won=false;keepPlaying=false;over=false;spawn();spawn();$('overlay').classList.remove('show');render()}
function render(){const board=$('board');board.innerHTML='';for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const cell=document.createElement('div');cell.className='cell';const v=grid[r][c];if(v){const tile=document.createElement('div');tile.className='tile'+(v>2048?' high':'');tile.dataset.v=String(v);tile.textContent=v;cell.appendChild(tile)}board.appendChild(cell)}$('score').textContent=score.toLocaleString();$('best').textContent=best.toLocaleString();$('undo').disabled=!history;$('undo').style.opacity=history?1:.4}
function lineMove(line){let a=line.filter(Boolean),gained=0;for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;gained+=a[i];a.splice(i+1,1)}while(a.length<SIZE)a.push(0);return {line:a,gained}}
function move(dir){if(over)return;const before=clone(grid),oldScore=score;let changed=false,gained=0;for(let i=0;i<SIZE;i++){let line=[];for(let j=0;j<SIZE;j++){const r=dir==='up'?j:dir==='down'?SIZE-1-j:i;const c=dir==='left'?j:dir==='right'?SIZE-1-j:i;line.push(grid[r][c])}const result=lineMove(line);gained+=result.gained;for(let j=0;j<SIZE;j++){const r=dir==='up'?j:dir==='down'?SIZE-1-j:i;const c=dir==='left'?j:dir==='right'?SIZE-1-j:i;if(grid[r][c]!==result.line[j])changed=true;grid[r][c]=result.line[j]}}
if(!changed)return;history={grid:before,score:oldScore};score+=gained;if(score>best){best=score;localStorage.setItem('2040-best',best)}spawn();if(!won&&grid.some(row=>row.includes(2048))){won=true;showOverlay('2048 달성!','대단해요. 계속해서 더 높은 숫자에 도전할 수 있어요.','계속하기',true)}else if(!canMove()){over=true;showOverlay('게임 종료','더 이상 움직일 수 없어요. 다시 도전해 보세요.','다시 시작',false)}render()}
function canMove(){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(!grid[r][c])return true;if(c<3&&grid[r][c]===grid[r][c+1])return true;if(r<3&&grid[r][c]===grid[r+1][c])return true}return false}
function showOverlay(title,msg,btn,win){$('overTitle').textContent=title;$('overText').textContent=msg;$('overlayBtn').textContent=btn;$('overlay').classList.add('show');$('overlayBtn').onclick=()=>{if(win){keepPlaying=true;$('overlay').classList.remove('show')}else start()}}
function undo(){if(!history)return;grid=clone(history.grid);score=history.score;history=null;over=false;$('overlay').classList.remove('show');render()}
$('restart').onclick=()=>{if(confirm('새 게임을 시작할까요? 현재 점수는 사라집니다.'))start()};$('undo').onclick=undo;
window.addEventListener('keydown',e=>{const keys={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};const dir=keys[e.key];if(dir){e.preventDefault();move(dir)}});
let touch=null;const area=$('board');area.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touch=[t.clientX,t.clientY]},{passive:true});area.addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch[0],dy=t.clientY-touch[1];touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
start();
</script>
</body></html>
